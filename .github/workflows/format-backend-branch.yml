name: Format Backend Branch

on:
  workflow_dispatch:
  push:
    branches:
      - feat/multimodal-v1-foundation
    paths:
      - ".github/workflows/format-backend-branch.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multimodal-v1-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and autofix
        run: |
          python -m pip install --quiet ruff
          cd backend
          ruff check app tests --fix
          ruff format app tests
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style: format autoannotation backend"
          git push origin HEAD:feat/multimodal-v1-foundation
