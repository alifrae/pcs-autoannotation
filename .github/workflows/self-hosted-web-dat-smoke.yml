name: PCS DAT Web Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feat/multimodal-v1-foundation
    paths:
      - "frontend/src/components/PcsDatWorkspace/**"
      - "frontend/e2e/pcs-dat.spec.ts"
      - "backend/app/api/routes/autoannotation.py"
      - ".github/workflows/self-hosted-web-dat-smoke.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AUTO_VENV: /media/o-ralilou/Data/lidar-lab/runtime/autoannotation-py312
  HF_HOME: /media/o-ralilou/Data/lidar-lab/models/huggingface
  MODEL_DIR: /media/o-ralilou/Data/lidar-lab/models/locate-anything-3b
  INNOV3_PYTHON: /media/o-ralilou/Data/lidar-lab/runtime/dsvt-py311-cu124/bin/python
  INNOV3_CONFIG_PATH: /media/o-ralilou/Data/lidar-lab/models/internal-dsvt/internal_config.pkl
  INNOV3_CHECKPOINT_PATH: /media/o-ralilou/Data/lidar-lab/models/internal-dsvt/innov3_dsvt_weights.pt
  INNOV3_DSVT_ROOT: /media/o-ralilou/Data/lidar-lab/runtimes/DSVT
  INNOV3_DEVICE: cuda
  DEVICE: cuda
  PCS_NATIVE_REQUIRED: "true"
  AUTOANNOTATION_CAMERA_RELEASE_VLM_BEFORE_SAM2: "true"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  web-smoke:
    name: Real Highway browser smoke
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Highway trace
        shell: bash
        run: |
          set -euo pipefail
          TRACE_PATH="$(python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          config_path = Path.home() / ".config" / "engineering-trace-catalog" / "config.toml"
          with config_path.open("rb") as stream:
              config = tomllib.load(stream)
          catalog = config["catalog"]
          root_env = str(catalog.get("root_env", "ENGINEERING_TRACE_CATALOG_ROOT"))
          root_value = os.environ.get(root_env, "") or str(catalog.get("root", ""))
          root = Path(os.path.expandvars(root_value)).expanduser()
          if not root.is_absolute():
              root = config_path.parent / root
          manifest = root / str(catalog.get("manifest", "catalog.toml"))
          with manifest.open("rb") as stream:
              data = tomllib.load(stream)
          entry = next(item for item in data["datasets"] if item["id"] == "highway-v1")
          print((root / entry["path"]).resolve())
          PY
          )"
          test -f "$TRACE_PATH"
          echo "PCS_DAT_E2E_PATH=$TRACE_PATH" >> "$GITHUB_ENV"
          echo "trace=$TRACE_PATH"

      - name: Verify provisioned companion runtime
        shell: bash
        run: |
          set -euo pipefail
          test -x "$AUTO_VENV/bin/python"
          test -x "$INNOV3_PYTHON"
          test -f "$INNOV3_CONFIG_PATH"
          test -f "$INNOV3_CHECKPOINT_PATH"
          test -d "$INNOV3_DSVT_ROOT"
          test -f "$MODEL_DIR/config.json"
          "$AUTO_VENV/bin/python" - <<'PY'
          import point_cloud_studio_native as native
          import torch

          assert hasattr(native.transport, "NativeDatReader")
          assert hasattr(native.transport, "NativeDatImageStreamSource")
          assert hasattr(native.transport, "NativeDatAdmaStreamSource")
          assert hasattr(native.export, "decode_ifscan10_to_arrow")
          assert torch.cuda.is_available()
          print("pcs_native=", native.__version__)
          print("gpu=", torch.cuda.get_device_name(0))
          PY

      - name: Sync backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$AUTO_VENV/bin/python" -m pip install --quiet -r backend/requirements.txt

      - name: Start backend
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/pcs-autoannotation-web-smoke.db
          (
            cd backend
            DATABASE_URL="sqlite:////tmp/pcs-autoannotation-web-smoke.db"             PYTHONPATH="$GITHUB_WORKSPACE/backend"             "$AUTO_VENV/bin/python" -m uvicorn app.main:app               --host 127.0.0.1 --port 18000               > "$RUNNER_TEMP/pcs-autoannotation-backend.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/pcs-autoannotation-backend.pid"
          )
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/api/health >/dev/null; then
              echo "backend=ready"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/pcs-autoannotation-backend.log"
          exit 1

      - name: Verify DAT API before browser
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent             -H "Content-Type: application/json"             -d "{"path":"$PCS_DAT_E2E_PATH"}"             http://127.0.0.1:18000/api/v1/autoannotation/dat/inspect             > "$RUNNER_TEMP/dat-inspect.json"
          python3 - "$RUNNER_TEMP/dat-inspect.json" <<'PY'
          import json
          import sys

          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert "ScaLa 3-PointCloud" in data["lidar_streams"]
          assert "Genicam2" in data["camera_streams"]
          assert data["adma_streams"]
          print("dat_api=ready")
          PY

      - name: Install frontend and Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      - name: Run real PCS DAT browser smoke
        shell: bash
        env:
          VITE_BACKEND_PORT: "18000"
        run: |
          set -euo pipefail
          cd frontend
          pnpm exec playwright test e2e/pcs-dat.spec.ts
          echo "pcs_dat_web_smoke=PASS"

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcs-dat-web-smoke-${{ github.run_id }}
          path: |
            frontend/test-results/
            ${{ runner.temp }}/pcs-autoannotation-backend.log
            ${{ runner.temp }}/dat-inspect.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/pcs-autoannotation-backend.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/pcs-autoannotation-backend.pid")" 2>/dev/null || true
          fi
